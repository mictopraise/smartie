name: Build Laundry Rush APK

on:
  push:
    branches: [laundry-rush-build]
    paths:
      - 'laundry-rush/**'
      - '.github/workflows/build-laundry-rush.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4

    env:
      HOME: /root
      ANDROID_HOME: /usr/lib/android-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Android SDK requirements
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          yes | sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Verify Godot Android environment
        run: |
          godot --version
          java -version
          test -f "$HOME/.local/share/godot/export_templates/4.4.stable/android_debug.apk"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
          echo "Godot Android environment OK"

      - name: Import project once
        working-directory: laundry-rush
        run: godot --headless --editor --path . --quit

      - name: Prepare build folder
        run: mkdir -p laundry-rush/build

      - name: Export Android debug APK
        working-directory: laundry-rush
        run: |
          echo "--- Preset ---"
          cat export_presets.cfg
          echo "--- Export ---"
          godot --headless --verbose --path . --export-debug "Android" build/LaundryRush-debug.apk

      - name: Verify APK
        run: |
          test -f laundry-rush/build/LaundryRush-debug.apk
          ls -lh laundry-rush/build/LaundryRush-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose laundry-rush/build/LaundryRush-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Laundry-Rush-APK
          path: laundry-rush/build/LaundryRush-debug.apk
