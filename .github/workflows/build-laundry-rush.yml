name: Build Laundry Rush APK

on:
  push:
    branches: [laundry-rush-build]
    paths:
      - 'laundry-rush/**'
      - '.github/workflows/build-laundry-rush.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4

    steps:
      - uses: actions/checkout@v4

      - name: Normalize Godot CI home
        run: |
          echo "HOME=$HOME"
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          cp -a /root/.local/share/godot/export_templates/4.4.stable "$HOME/.local/share/godot/export_templates/"
          cp /root/debug.keystore "$HOME/debug.keystore"
          sed -i "s#/root/debug.keystore#$HOME/debug.keystore#g" "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "--- Godot home config ---"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "--- Export templates ---"
          ls -la "$HOME/.local/share/godot/export_templates/4.4.stable"
          echo "--- Debug keystore ---"
          ls -la "$HOME/debug.keystore"

      - name: Install Godot 4.4 Android requirements
        run: |
          yes | sdkmanager --sdk_root=/usr/lib/android-sdk \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Verify Android environment
        run: |
          godot --version
          java -version
          ls -la /usr/lib/android-sdk/build-tools/34.0.0
          ls -la /usr/lib/android-sdk/platforms/android-34

      - name: Prepare build folder
        run: mkdir -p laundry-rush/build

      - name: Export Android debug APK
        working-directory: laundry-rush
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          echo "--- Preset ---"
          cat export_presets.cfg
          echo "--- Export ---"
          godot --headless --verbose --path . --export-debug "Android" build/LaundryRush-debug.apk

      - name: Verify APK
        run: |
          test -f laundry-rush/build/LaundryRush-debug.apk
          ls -lh laundry-rush/build/LaundryRush-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Laundry-Rush-APK
          path: laundry-rush/build/LaundryRush-debug.apk
